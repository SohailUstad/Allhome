<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">ColourCoats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body>

<!-- Operator console navigation -->
<nav th:fragment="operatorNav(active)" class="navbar navbar-expand-md navbar-dark bg-ink sticky-top shadow-sm">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand brand-serif" th:href="@{/leads}">ColourCoats <span class="brand-sub">Lead console</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#opNav" aria-controls="opNav"
                aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="opNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'leads'} ? 'active'" th:href="@{/leads}">
                    <i class="bi bi-people me-1"></i>Leads</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leads(followUp='needed',sort='handoff')}">
                    <i class="bi bi-telephone-outbound me-1"></i>Needs follow-up</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'prompt'} ? 'active'" th:href="@{/prompts}">
                    <i class="bi bi-sliders me-1"></i>Agent prompt</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/}" target="_blank" rel="noopener">
                    <i class="bi bi-box-arrow-up-right me-1"></i>Website</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50 small" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">operator</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- "HOMEOWNER" -> "Homeowner", "ARCHITECT_OR_DESIGNER" -> "Architect or designer" -->
<span th:fragment="label(value)" th:text="${value == null ? '—' : #strings.capitalize(#strings.toLowerCase(#strings.replace(value, '_', ' ')))}">Label</span>

<span th:fragment="statusBadge(status)" class="badge rounded-pill"
      th:classappend="${status == 'QUALIFIED'} ? 'text-bg-success' : (${status == 'ENGAGED'} ? 'text-bg-primary' : 'text-bg-secondary')"
      th:text="${#strings.capitalize(#strings.toLowerCase(status))}">New</span>

<i th:fragment="channelIcon(channel)" class="bi"
   th:classappend="${channel == 'INSTAGRAM'} ? 'bi-instagram text-instagram' : (${channel == 'WEB_CHAT'} ? 'bi-chat-square-dots text-ink' : 'bi-chat-dots text-salesiq')"
   th:title="${channel == 'INSTAGRAM'} ? 'Instagram (via SalesIQ)' : (${channel == 'WEB_CHAT'} ? 'Website direct chat' : 'Zoho SalesIQ website chat')"></i>

<!-- Prompt version status: DRAFT, ACTIVE, ARCHIVED, DISCARDED -->
<span th:fragment="promptStatusBadge(status)" class="badge rounded-pill"
      th:classappend="${status == 'ACTIVE'} ? 'text-bg-success' : (${status == 'DRAFT'} ? 'text-bg-warning' : 'text-bg-secondary')"
      th:text="${#strings.capitalize(#strings.toLowerCase(status))}">Active</span>

<!-- Line diff of a prompt section: removed lines struck through, added lines highlighted -->
<div th:fragment="diff(lines)" class="prompt-diff">
    <div th:each="l : ${lines}" class="diff-line" th:classappend="${l.kind.name() == 'ADDED'} ? 'added' : (${l.kind.name() == 'REMOVED'} ? 'removed' : '')"
         ><span class="diff-mark" th:text="${l.kind.name() == 'ADDED'} ? '+' : (${l.kind.name() == 'REMOVED'} ? '−' : ' ')"> </span><span th:text="${l.text.isEmpty()} ? ' ' : ${l.text}">line</span></div>
</div>

<script th:fragment="bootstrapJs" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
