spring:
  application:
    name: chat-service
  datasource:
    # Defaults match compose.yaml at the repo root; override with environment variables everywhere else.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chat}
    username: ${DB_USERNAME:chat}
    password: ${DB_PASSWORD:chat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it
    properties:
      hibernate.jdbc.time_zone: UTC
      # Insert chunks in batches instead of one statement per row.
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # standard errors (missing part, upload too large, ...) as RFC 9457 problem responses
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    model:
      # Embeddings (knowledge) and chat (replies); the other OpenAI model types stay off.
      embedding: openai
      chat: openai
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
        temperature: 0.4
        max-completion-tokens: 600 # caps latency; replies are short and must fit SalesIQ's 5 s webhook limit
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536 # must match KnowledgeChunkEntity.EMBEDDING_DIMENSIONS and the vector(1536) column

ingestion:
  embedding-batch-size: 32

retrieval:
  top-k: 6 # chunks per question
  candidates: 20 # results each search (vector, keyword) contributes before they are fused
  min-similarity: 0.3 # cosine similarity below which a vector match is considered unrelated

operator:
  username: ${OPERATOR_USERNAME:operator}
  password: ${OPERATOR_PASSWORD:} # no default: without it nobody can log in
  time-zone: Asia/Kolkata # timestamps in the lead console

prompt:
  # The agent's system prompt is versioned in the database (table prompt_version) and edited by the operator.
  # This file is stored as version 1 on first start, and used if the database cannot be reached.
  seed: classpath:prompts/sales-system.md
  refresh-interval: 30s # other instances pick up an activated version within this time (this one at once)
  max-length: 50000 # characters, whole prompt
  locked-sections: [input, output] # the code depends on them: input format, reply format, injection rule
  protected-sections: [strict-grounding, persona, intent] # editable only with an explicit confirmation

evals:
  # A prompt draft can only be activated after a full eval run with the live model passed at least this share of the
  # cases (0.85 = 85%). Set through EVAL_ACTIVATION_MIN_PASS_RATE (Secret Manager on Cloud Run); 0 switches it off.
  activation-min-pass-rate: ${EVAL_ACTIVATION_MIN_PASS_RATE:0.85}
  judge-model: gpt-4.1 # grounding judge: stronger than the chat model, only used during evals

live-model:
  # Models the operator may make live for visitors (console page "Agent model"; a reason is required and recorded).
  # Only fast non-reasoning models: SalesIQ allows 3.8 s per reply. The default is spring.ai.openai.chat.model.
  models:
    - id: gpt-4.1-mini
      description: fast and cheap (default)
    - id: gpt-4.1
      description: more careful, slower, about 5x the cost
    - id: gpt-4o-mini
      description: fast and cheapest, weaker on rules
  min-reason-length: 15
  refresh-interval: 30s # other instances pick up a change within this time (this one at once)

prompt-editor:
  # The AI that proposes prompt changes in the console (same OpenAI key; it never answers visitors). The operator picks
  # one of these models per request; models the key cannot use are shown disabled. Standard models run at temperature
  # 0; reasoning models take a reasoning effort instead (and no temperature).
  default-model: gpt-4.1
  models:
    - id: gpt-4.1
      label: GPT-4.1
      description: fast (10–30 s), careful wording
    - id: gpt-5-mini
      label: GPT-5 mini
      description: reasoning, quicker and cheaper
      reasoning: true
      efforts: [low, medium, high]
    - id: gpt-5
      label: GPT-5
      description: reasoning, most careful, slowest and most expensive
      reasoning: true
      efforts: [low, medium, high]
    - id: o3
      label: o3
      description: reasoning, careful, slow
      reasoning: true
      efforts: [low, medium, high]
  max-output-tokens: 25000 # includes a reasoning model's hidden reasoning
  timeout: 170s # one request; stays inside Cloud Run's request timeout

chat:
  history-size: 20 # previous messages sent to the model each turn
  warm-up: true # one search + one tiny chat call at startup, so the first visitor's reply is not slow

salesiq:
  # SalesIQ widget embed code for the demo website (bottom right); empty = no widget.
  widget-code: ${SALESIQ_WIDGET_CODE:siq0749a3ca7ec1db8b9bb67400ae77afeec0a0841a625e72562724dcd20bf3d650}
  # Paste the public key(s) from SalesIQ > Zobot > Webhook > "Secure your webhook" (PEM or Base64; up to two).
  # Empty = signatures not checked (local testing only).
  public-keys: ${SALESIQ_PUBLIC_KEYS:}
  response-deadline-ms: 3800 # SalesIQ times out at 5000 ms end to end; leave ~1 s for network/tunnel
  # On handoff, transfer the live chat to a SalesIQ operator ("forward"); the AI then never answers that chat again.
  # If no operator picks it up, SalesIQ calls the bot again and gets "operator_busy" (SalesIQ's leave-a-message flow).
  forward-on-handoff: true
  department-id: ${SALESIQ_DEPARTMENT_ID:} # optional department for forwarded chats
  # First message of every chat (SalesIQ and the website chat). \n = line break.
  opener: "Hi there! I’m Aira 👋\nI’m here and ready to help. What can I help you with today?"
  fallback-message: "Thanks for your patience. I've passed your question to our team and a ColourCoats specialist will get back to you shortly."
  contact-request: "Could you share your name and phone number?" # appended to the fallback only when no phone is known yet
  transfer-message: "Let me connect you with one of our specialists, they'll be with you shortly." # timeout/failure while forwarding
  busy-message: "Our specialists are busy right now. Leave your message and number, and we'll get back to you soon."

logging:
  # Flow log (logger "flow"): one entry per step of each message, with full payloads (personal data), written as
  # JSON lines so every field is kept. Turn it off with logging.level.flow: OFF.
  structured:
    format:
      file: ecs
  file:
    name: ${LOG_FILE:logs/chat-service.jsonl}
  level:
    flow: INFO

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

# Shown at /actuator/info, so it is always clear which code is running.
info:
  app:
    name: chat-service
    version: "@project.version@"
    commit: ${APP_COMMIT:local} # set to the git commit id when deploying
