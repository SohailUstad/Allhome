# Tests never call OpenAI: the real models are off and TestAiConfiguration provides fakes.
spring:
  ai:
    model:
      embedding: none
      chat: none

operator:
  username: test-operator
  password: test-password

chat:
  warm-up: false

# Tests reset the prompt tables between tests; never serve a cached version that no longer exists.
prompt:
  refresh-interval: 0s

live-model:
  refresh-interval: 0s

# Activating drafts is tested without eval runs; the gate has its own tests.
evals:
  activation-min-pass-rate: 0
